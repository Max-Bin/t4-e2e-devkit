[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t4-e2e-devkit"
version = "0.1.0"
description = "Unified dataset, agent and evaluation interfaces for end-to-end planning models on TIER IV T4 datasets"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
authors = [{ name = "TIER IV" }]
keywords = ["autonomous-driving", "end-to-end", "planning", "t4-dataset", "pdm-score"]

# Deliberately NOT a dependency: nuplan-devkit.  The devkit carries its own
# geometry/state vocabulary so it needs neither a nuPlan maps database nor
# nuPlan's Python version floor.  See docs/architecture.md.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "shapely>=2.0",
    # The vendored nuPlan map/scoring types use GeoDataFrame at runtime, and
    # the T4 quaternion adapter is part of the core geometry path. Keep these
    # explicit instead of relying on a transitive navsim/nuPlan install.
    "geopandas>=0.14",
    "pyquaternion>=0.9.9",
    "torch>=2.1",
    "pytorch-lightning>=2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "zstandard>=0.21",
    "pillow>=10.0",
    "pandas>=2.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
camera = ["timm>=0.9", "torchvision>=0.16"]
lidar = ["spconv-cu120"]
viz = ["matplotlib>=3.7", "opencv-python-headless>=4.8"]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "matplotlib>=3.7",
    "opencv-python-headless>=4.8",
]

# uv-native development environment. The optional ``dev`` extra above stays
# for pip users; this group is what ``uv sync``/``uv run`` consume. Matplotlib
# and OpenCV are test dependencies because visualization and video-backed
# camera paths are part of the public reader interface.
[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "matplotlib>=3.7",
    "opencv-python-headless>=4.8",
]

[project.scripts]
t4e2e = "t4_e2e_devkit.cli:main"

[tool.uv]
# Match the supported T4-devkit/Python window and make quality tools available
# from a plain ``uv sync``.
default-groups = ["dev"]

[tool.setuptools.packages.find]
include = ["t4_e2e_devkit*"]

[tool.setuptools.package-data]
t4_e2e_devkit = ["script/config/**/*.yaml", "script/config/**/*.yml"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored trees are byte-identical ports; a lint fix applied here would be
# reverted by the next `tools/vendor.py sync` and belongs upstream instead.
extend-exclude = [
    "t4_e2e_devkit/common/actor_state",
    "t4_e2e_devkit/common/geometry",
    "t4_e2e_devkit/common/maps",
    "t4_e2e_devkit/common/utils",
    "t4_e2e_devkit/planning/simulation/trajectory",
    "t4_e2e_devkit/planning/simulation/occupancy_map",
    "t4_e2e_devkit/planning/simulation/path",
    "t4_e2e_devkit/planning/simulation/pdm_sim",
    "t4_e2e_devkit/planning/simulation/planner/pdm_planner",
    "t4_e2e_devkit/evaluation/gpu",
    "t4_e2e_devkit/evaluation/reference",
    "t4_e2e_devkit/evaluation/tier4_metrics",
    # Individually vendored files.
    "t4_e2e_devkit/dataset/scene.py",
    "t4_e2e_devkit/evaluation/oracle_evaluator.py",
    "t4_e2e_devkit/evaluation/ego_progress.py",
    "t4_e2e_devkit/planning/simulation/observation/idm_utils.py",
    "t4_e2e_devkit/planning/simulation/planner/transform_utils.py",
    "t4_e2e_devkit/planning/simulation/simulation_iteration.py",
    "references",
]

[tool.ruff.lint]
# `UP` (pyupgrade) is deliberately absent. Roughly a third of this package is
# vendored code written against typing.Dict/Optional, and devkit-authored
# modules sit next to it and call into it -- so `dict[str, Any]` in one file and
# `Dict[str, Any]` in the file it imports from reads worse than either
# convention applied consistently. Match the surrounding code.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# The TYPE_CHECKING block re-imports the lazily exported names so type checkers
# and IDEs can see them; at runtime __getattr__ resolves them instead, so ruff
# reads the block as unused imports.
"t4_e2e_devkit/__init__.py" = ["F401"]
"t4_e2e_devkit/planning/training/__init__.py" = ["F401"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device",
    "data: requires the T4 dataset on disk",
    "slow: long-running consistency checks",
]
